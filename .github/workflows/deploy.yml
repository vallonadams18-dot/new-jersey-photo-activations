name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `npm ci`, not `npm install`: it installs exactly what the lockfile pins
      # and fails loudly when the lockfile and package.json have drifted. Plain
      # `npm install` is free to resolve newer versions inside the caret ranges,
      # which is how a commit that built in September stops building in October
      # with nobody having touched the code.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build static site
        run: npm run build
        env:
          # Set these under Settings -> Secrets and variables -> Actions -> Variables.
          # NEXT_PUBLIC_SITE_URL is the important one: it drives every canonical,
          # Open Graph tag, sitemap entry and schema @id on the site.
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SITE_EMAIL: ${{ vars.NEXT_PUBLIC_SITE_EMAIL }}
          NEXT_PUBLIC_LEAD_ENDPOINT: ${{ vars.NEXT_PUBLIC_LEAD_ENDPOINT }}
          NEXT_PUBLIC_LEAD_WEBHOOK_URL: ${{ vars.NEXT_PUBLIC_LEAD_WEBHOOK_URL }}
          NEXT_PUBLIC_GSC_VERIFICATION: ${{ vars.NEXT_PUBLIC_GSC_VERIFICATION }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
